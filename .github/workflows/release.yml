name: Release

# Push a tag like v0.2.0 to publish a release. Forge (and any Foundry) installs from
# https://github.com/<owner>/<repo>/releases/latest/download/module.json
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Stamp version and URLs into module.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .url = $url | .manifest = $manifest | .download = $download' \
             dist/module.json > module.json
          cp module.json dist/module.json

      - name: Zip the module
        run: cd dist && zip -r ../module.zip .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" module.json module.zip --title "$TAG" --generate-notes
